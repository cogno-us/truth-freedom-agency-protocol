name: Validate TFA evaluation files

on:
  pull_request:
    paths:
      - "README.md"
      - "EVALUATION.md"
      - "evaluation/**"
      - "scripts/validate_evaluation.py"
      - ".github/workflows/validate-evaluation.yml"
  push:
    branches:
      - main
    paths:
      - "evaluation/**"
      - "scripts/validate_evaluation.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate evaluation cases
        run: python scripts/validate_evaluation.py evaluation/cases.json
